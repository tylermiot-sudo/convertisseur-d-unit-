<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card">
        <a href="index.html" class="retour">⬅ Retour</a>
        
        <h1 id="titre">🔄 Convertisseur</h1>

        <div class="ligne">
            <select id="depart"></select>
        </div>

        <button id="swap">⇅</button>

        <div class="ligne">
            <select id="arrivee"></select>
        </div>

        <input type="number" id="valeur" placeholder="Entrez une valeur" step="any">

        <div id="resultat"></div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
